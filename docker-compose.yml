services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c216-backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: c216_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

  database:
    image: postgres:16
    container_name: c216-database
    environment:
      POSTGRES_DB: c216_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: